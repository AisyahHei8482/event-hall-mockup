kind: wasmer.io/App.v0
name: event-hall-mockup
app_id: da_2l9IzteUYVo6
owner: aisyahhei8482
package: .
env:
  PHPIX_PHP_THREADS: '4'

locality:
  regions:
    - fr-roub1
    
volumes:
- name: laravel-uploads
  mount: /app/storage/app/public
jobs:
- name: after_deploy
  trigger: post-deployment
  action:
    execute:
      command: after_deploy
annotations:
  anybuild.run/config:
    composer_enable: false
    name: out
    node_build_command: npm run build
    node_install_inputs:
    - package.json
    node_package_manager: npm
    npm_version: '11'
    php_framework: laravel
    php_public_dir: public
    phpix: true
    commands:
      install: ''
    composer_build_script: post-update-cmd
  anybuild.run/provider: laravel
  anybuild.run/version: 0.29.0
  wasmer.io/version: 7.4.2
enableDatabase: true
